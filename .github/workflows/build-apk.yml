# Builds the Android APK on GitHub's servers. No computer or Expo account needed.
# Runs on every push to main, or manually from the Actions tab ("Run workflow").
# Download the APK from the finished run's "Artifacts" section.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild -p android --no-install

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME).
      - name: Build release APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: PR-Infinity-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk

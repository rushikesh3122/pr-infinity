# Runs MongoDB + the API with one command: docker compose up -d
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/pr_infinity
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - invoice-pdfs:/app/uploads

volumes:
  mongo-data:
  invoice-pdfs:
